name: Windows

on:
  pull_request:
    paths:
      - ".github/workflows/windows.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "components/**"
      - "crates/**"
      - "tools/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "components/**"
      - "crates/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loader:
    name: Windows integration
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install x86 Rust target
        run: rustup target add i686-pc-windows-msvc

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run x86 Clippy
        run: >
          cargo clippy
          -p darpc-game-client
          -p darpc-hook
          -p loader
          -p rpc-dll
          -p injection-target
          -p hook-harness
          -p loader-fixture-dll
          --target i686-pc-windows-msvc
          --all-targets
          -- -D warnings

      - name: Run x64 Clippy
        run: >
          cargo clippy
          -p darpc-model
          -p darpc-protocol
          -p rpc-client
          -p rpc-daemon
          --all-targets
          -- -D warnings

      - name: Run x86 unit tests
        run: >
          cargo test
          -p darpc-game-client
          -p darpc-hook
          -p loader
          -p injection-target
          -p hook-harness
          --target i686-pc-windows-msvc

      - name: Run x64 unit tests
        run: >
          cargo test
          -p darpc-model
          -p darpc-protocol
          -p rpc-client
          -p rpc-daemon

      - name: Build x86 integration artifacts
        run: >
          cargo build
          -p loader
          -p rpc-dll
          -p injection-target
          -p hook-harness
          -p loader-fixture-dll
          --target i686-pc-windows-msvc

      - name: Build release hook harness
        run: >
          cargo build
          -p hook-harness
          --target i686-pc-windows-msvc
          --release

      - name: Build x64 integration artifacts
        run: cargo build -p rpc-client -p rpc-daemon

      - name: Run loader integration checks
        shell: pwsh
        run: >
          ./tools/injection-target/test-loader.ps1
          -TargetDir ./target/i686-pc-windows-msvc/debug

      - name: Run hook qualification checks
        shell: pwsh
        run: |
          ./tools/test-hook.ps1 -TargetDir ./target/i686-pc-windows-msvc/debug
          ./tools/test-hook.ps1 -TargetDir ./target/i686-pc-windows-msvc/release

      - name: Run direct IPC integration checks
        shell: pwsh
        run: >
          ./tools/test-ipc.ps1
          -X86TargetDir ./target/i686-pc-windows-msvc/debug
          -X64TargetDir ./target/debug

      - name: Run daemon integration checks
        shell: pwsh
        run: >
          ./tools/test-daemon.ps1
          -X86TargetDir ./target/i686-pc-windows-msvc/debug
          -X64TargetDir ./target/debug
