name: Windows

on:
  pull_request:
    paths:
      - ".github/workflows/windows.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "components/**"
      - "crates/**"
      - "tools/**"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/windows.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "components/**"
      - "crates/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  loader:
    name: Windows integration
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install x86 Rust target
        run: rustup target add i686-pc-windows-msvc

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run x86 Clippy
        run: >
          cargo clippy
          -p darpc-game-client
          -p darpc-hook
          -p loader
          -p rpc-dll
          -p injection-target
          -p hook-harness
          -p loader-fixture-dll
          --target i686-pc-windows-msvc
          --all-targets
          -- -D warnings

      - name: Run x64 Clippy
        run: >
          cargo clippy
          -p darpc-model
          -p darpc-protocol
          -p rpc-client
          -p rpc-daemon
          --all-targets
          -- -D warnings

      - name: Run x86 unit tests
        run: >
          cargo test
          -p darpc-game-client
          -p darpc-hook
          -p loader
          -p rpc-dll
          -p injection-target
          -p hook-harness
          --target i686-pc-windows-msvc

      - name: Run x64 unit tests
        run: >
          cargo test
          -p darpc-model
          -p darpc-protocol
          -p rpc-client
          -p rpc-daemon

      - name: Build x86 integration artifacts
        run: >
          cargo build
          -p loader
          -p rpc-dll
          -p injection-target
          -p hook-harness
          -p loader-fixture-dll
          --target i686-pc-windows-msvc

      - name: Build release hook harness
        run: >
          cargo build
          -p hook-harness
          --target i686-pc-windows-msvc
          --release

      - name: Build x64 integration artifacts
        run: cargo build -p rpc-client -p rpc-daemon

      - name: Run loader integration checks
        shell: pwsh
        run: >
          ./tools/injection-target/test-loader.ps1
          -TargetDir ./target/i686-pc-windows-msvc/debug

      - name: Run hook qualification checks
        shell: pwsh
        run: |
          ./tools/test-hook.ps1 -TargetDir ./target/i686-pc-windows-msvc/debug
          ./tools/test-hook.ps1 -TargetDir ./target/i686-pc-windows-msvc/release

      - name: Run direct IPC integration checks
        shell: pwsh
        run: >
          ./tools/test-ipc.ps1
          -X86TargetDir ./target/i686-pc-windows-msvc/debug
          -X64TargetDir ./target/debug

      - name: Run daemon integration checks
        shell: pwsh
        run: >
          ./tools/test-daemon.ps1
          -X86TargetDir ./target/i686-pc-windows-msvc/debug
          -X64TargetDir ./target/debug

  release:
    name: Windows release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: loader
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Windows Rust targets
        run: rustup target add i686-pc-windows-msvc x86_64-pc-windows-msvc

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: windows
          save-if: "false"

      - name: Verify release version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $packageVersions = @($metadata.packages.version | Sort-Object -Unique)
          if ($packageVersions.Count -ne 1 -or $packageVersions[0] -ne $tagVersion) {
            throw "release tag $tagVersion does not match every workspace package"
          }

      - name: Build x86 release artifacts
        run: >
          cargo build
          -p loader
          -p rpc-dll
          --target i686-pc-windows-msvc
          --release

      - name: Build x64 release artifacts
        run: >
          cargo build
          -p rpc-client
          -p rpc-daemon
          --target x86_64-pc-windows-msvc
          --release

      - name: Package release artifacts
        id: package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $archive = "dist/da-rpc-$tag-windows.zip"
          $checksum = "$archive.sha256"
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File ./tools/package-release.ps1 `
            -Tag $tag `
            -X86TargetDir "target/i686-pc-windows-msvc/release" `
            -X64TargetDir "target/x86_64-pc-windows-msvc/release" `
            -OutputDir "dist"
          if ($LASTEXITCODE -ne 0) {
            throw "failed to package release artifacts"
          }

          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              "${{ steps.package.outputs.archive }}" `
              "${{ steps.package.outputs.checksum }}" `
              --clobber
          } else {
            gh release create $tag `
              "${{ steps.package.outputs.archive }}" `
              "${{ steps.package.outputs.checksum }}" `
              --verify-tag `
              --title $tag `
              --generate-notes
          }
