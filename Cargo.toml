[workspace]
resolver = "3"
members = [
    "components/rpc-client",
    "components/loader",
    "components/rpc-dll",
    "components/rpc-daemon",
    "crates/game-client",
    "crates/hook",
    "crates/model",
    "crates/protocol",
    "crates/win32",
    "tools/injection-target",
    "tools/hook-harness",
    "tools/lifecycle-host",
    "tools/loader-fixture-dll",
]

[workspace.package]
authors = ["Erik 'SiLo' Rogers"]
edition = "2024"
license = "MIT"
repository = "https://github.com/ewrogers/da-rpc"
version = "1.6.0"

[workspace.dependencies]
darpc-game-client = { path = "crates/game-client" }
darpc-hook = { path = "crates/hook" }
darpc-model = { path = "crates/model" }
darpc-protocol = { path = "crates/protocol" }
darpc-win32 = { path = "crates/win32" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = { version = "0.11", default-features = false }
serde_json = "1"
windows-sys = { version = "0.61", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
